<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEARLESS // CHARACTER DATABASE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap');

  :root {
    --bg-void: #050508;
    --bg-panel: #0a0a0f;
    --bg-card: #0d0d14;
    --bg-card-hover: #12121c;
    --border-dim: #1a1a2e;
    --border-glow: #2a2a4a;
    --accent-cyan: #00d4ff;
    --accent-cyan-dim: rgba(0, 212, 255, 0.15);
    --accent-cyan-glow: rgba(0, 212, 255, 0.05);
    --accent-violet: #7b2fff;
    --accent-violet-dim: rgba(123, 47, 255, 0.2);
    --text-primary: #e8eaf0;
    --text-secondary: #6b7280;
    --text-muted: #3d4048;
    --text-mono: #00d4ff;
    --danger: #ff3860;
    --success: #00e676;
    --scan-line: rgba(0, 212, 255, 0.03);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--scan-line) 2px,
      var(--scan-line) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* ─── HEADER ─── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5, 5, 8, 0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-dim);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    opacity: 0.4;
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.1rem;
    color: var(--accent-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .logo span {
    color: var(--text-secondary);
    font-size: 0.75rem;
    display: block;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-secondary);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ─── ADMIN BUTTON ─── */
  .btn-admin {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    padding: 0.4rem 1rem;
    background: transparent;
    border: 1px solid var(--border-glow);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }

  .btn-admin:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: var(--accent-cyan-glow);
  }

  .btn-admin.active {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: var(--accent-cyan-dim);
  }

  /* ─── MAIN ─── */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* ─── SEARCH BAR ─── */
  .search-wrap {
    position: relative;
    margin-bottom: 2rem;
  }

  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
  }

  #searchInput {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--border-dim);
    border-radius: 0;
    color: var(--text-primary);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    padding: 0.85rem 1rem 0.85rem 3rem;
    outline: none;
    transition: all 0.2s;
    clip-path: polygon(16px 0%, 100% 0%, calc(100% - 16px) 100%, 0% 100%);
  }

  #searchInput::placeholder { color: var(--text-muted); }

  #searchInput:focus {
    border-color: var(--accent-cyan);
    background: var(--bg-card);
    box-shadow: 0 0 20px var(--accent-cyan-glow);
  }

  /* ─── CATEGORY BAR ─── */
  .category-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .cat-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    padding: 0.45rem 1.1rem;
    background: transparent;
    border: 1px solid var(--border-dim);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    white-space: nowrap;
  }

  .cat-btn:hover {
    border-color: var(--border-glow);
    color: var(--text-primary);
  }

  .cat-btn.active {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: var(--accent-cyan-dim);
  }

  .cat-add-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    padding: 0.45rem 0.8rem;
    background: transparent;
    border: 1px dashed var(--border-dim);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    display: none;
  }

  .cat-add-btn:hover {
    border-color: var(--accent-violet);
    color: var(--accent-violet);
  }

  /* ─── GRID ─── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.25rem;
  }

  /* ─── CARD ─── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-dim);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-glow);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-cyan-glow);
  }

  .card:hover::before { opacity: 1; }

  /* Card thumbnail */
  .card-thumb {
    width: 100%;
    aspect-ratio: 3/4;
    position: relative;
    overflow: hidden;
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.85) contrast(1.1);
    transition: filter 0.2s;
  }

  .card:hover .card-thumb img { filter: brightness(0.95) contrast(1.1); }

  .card-thumb-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #0f0f1a 0%, #1a1030 50%, #0a0a14 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .card-thumb-placeholder::after {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 40px,
        rgba(0,212,255,0.03) 40px,
        rgba(0,212,255,0.03) 41px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 40px,
        rgba(0,212,255,0.03) 40px,
        rgba(0,212,255,0.03) 41px
      );
  }

  .thumb-initials {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    color: rgba(0, 212, 255, 0.25);
    z-index: 1;
    letter-spacing: 0.1em;
  }

  .card-thumb-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60%;
    background: linear-gradient(to top, rgba(5,5,8,0.95) 0%, transparent 100%);
  }

  /* Card info */
  .card-info {
    padding: 0.75rem;
  }

  .card-codename {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 0.4rem;
  }

  .card-meta {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .card-meta-item {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.62rem;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
  }

  .card-meta-item span {
    color: var(--text-muted);
    margin-right: 0.3em;
  }

  .card-category-tag {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    padding: 0.2rem 0.5rem;
    background: rgba(5,5,8,0.85);
    border: 1px solid var(--border-glow);
    color: var(--accent-cyan);
    clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
  }

  /* Admin card controls */
  .card-admin-controls {
    position: absolute;
    top: 0.5rem;
    left: 0.5rem;
    display: none;
    gap: 0.3rem;
  }

  .admin-mode .card-admin-controls { display: flex; }

  .card-edit-btn, .card-delete-btn {
    width: 28px;
    height: 28px;
    border: 1px solid;
    background: rgba(5,5,8,0.9);
    cursor: pointer;
    font-size: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .card-edit-btn { border-color: var(--border-glow); color: var(--text-secondary); }
  .card-edit-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
  .card-delete-btn { border-color: var(--border-glow); color: var(--text-secondary); }
  .card-delete-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* ─── ADD CARD ─── */
  .card-add {
    background: transparent;
    border: 1px dashed var(--border-dim);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 280px;
    flex-direction: column;
    gap: 0.5rem;
  }

  .admin-mode .card-add { display: flex; }

  .card-add:hover {
    border-color: var(--accent-violet);
    background: var(--accent-violet-dim);
  }

  .card-add-icon {
    font-size: 1.5rem;
    color: var(--text-muted);
    font-family: 'Share Tech Mono', monospace;
    transition: color 0.2s;
  }

  .card-add:hover .card-add-icon { color: var(--accent-violet); }

  .card-add-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    transition: color 0.2s;
  }

  .card-add:hover .card-add-label { color: var(--accent-violet); }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 5rem 2rem;
    color: var(--text-muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
  }

  /* ─── MODAL BASE ─── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    width: 90%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
  }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
  }

  .modal-header {
    padding: 1.5rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: var(--accent-cyan);
    text-transform: uppercase;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    transition: color 0.15s;
  }

  .modal-close:hover { color: var(--text-primary); }

  .modal-body { padding: 1.5rem; }

  /* ─── FORM ELEMENTS ─── */
  .form-group { margin-bottom: 1.25rem; }

  .form-label {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--text-secondary);
    margin-bottom: 0.45rem;
    text-transform: uppercase;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border-dim);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    padding: 0.65rem 0.85rem;
    outline: none;
    transition: border-color 0.15s;
    border-radius: 0;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent-cyan);
  }

  .form-textarea {
    resize: vertical;
    min-height: 120px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.7;
  }

  .form-select { cursor: pointer; }
  .form-select option { background: var(--bg-panel); }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  /* Image upload */
  .img-upload-area {
    border: 1px dashed var(--border-glow);
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .img-upload-area:hover {
    border-color: var(--accent-cyan);
    background: var(--accent-cyan-glow);
  }

  .img-upload-area input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .img-upload-preview {
    width: 80px;
    aspect-ratio: 3/4;
    object-fit: cover;
    margin: 0 auto 0.5rem;
    display: block;
    border: 1px solid var(--border-glow);
  }

  .img-upload-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  /* Form buttons */
  .form-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border-dim);
  }

  .btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    padding: 0.6rem 1.4rem;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.15s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent-cyan-dim);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  .btn-primary:hover {
    background: rgba(0,212,255,0.25);
  }

  .btn-secondary {
    background: transparent;
    border-color: var(--border-glow);
    color: var(--text-secondary);
  }

  .btn-secondary:hover {
    border-color: var(--text-secondary);
    color: var(--text-primary);
  }

  .btn-danger {
    background: rgba(255,56,96,0.1);
    border-color: var(--danger);
    color: var(--danger);
  }

  .btn-danger:hover { background: rgba(255,56,96,0.2); }

  /* ─── DETAIL MODAL ─── */
  .detail-modal { max-width: 700px; }

  .detail-layout {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 1.5rem;
  }

  .detail-thumb {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    border: 1px solid var(--border-glow);
  }

  .detail-thumb-placeholder {
    width: 100%;
    aspect-ratio: 3/4;
    background: linear-gradient(160deg, #0f0f1a 0%, #1a1030 50%, #0a0a14 100%);
    border: 1px solid var(--border-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 3rem;
    font-weight: 700;
    color: rgba(0,212,255,0.2);
  }

  .detail-codename {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
  }

  .detail-fields {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border-dim);
  }

  .detail-field {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-secondary);
  }

  .detail-field strong {
    color: var(--text-muted);
    margin-right: 0.5em;
    font-weight: normal;
  }

  .detail-prompt-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    color: var(--accent-cyan);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
  }

  .detail-prompt {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.8;
    background: var(--bg-card);
    border: 1px solid var(--border-dim);
    padding: 1rem;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow-y: auto;
  }

  .copy-btn {
    margin-top: 0.75rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    padding: 0.45rem 1rem;
    background: transparent;
    border: 1px solid var(--border-glow);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  }

  .copy-btn:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  /* ─── AUTH MODAL ─── */
  .auth-modal { max-width: 380px; }

  .auth-desc {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-secondary);
    margin-bottom: 1.25rem;
    line-height: 1.7;
    letter-spacing: 0.05em;
  }

  .auth-error {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--danger);
    margin-top: 0.5rem;
    display: none;
    letter-spacing: 0.05em;
  }

  /* ─── CATEGORY MANAGE ─── */
  .cat-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-dim);
    margin-bottom: 0.4rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .cat-list-item-actions { display: flex; gap: 0.3rem; }

  .cat-action-btn {
    background: none;
    border: 1px solid var(--border-dim);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.65rem;
    padding: 0.2rem 0.5rem;
    font-family: 'Share Tech Mono', monospace;
    transition: all 0.15s;
  }

  .cat-action-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
  .cat-action-btn.del:hover { border-color: var(--danger); color: var(--danger); }

  /* ─── TOAST ─── */
  #toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--bg-panel);
    border: 1px solid var(--accent-cyan);
    border-left: 3px solid var(--accent-cyan);
    color: var(--accent-cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    padding: 0.75rem 1.25rem;
    z-index: 999;
    transform: translateY(4rem);
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
  }

  #toast.show { transform: translateY(0); opacity: 1; }

  /* ─── ADMIN BANNER ─── */
  .admin-banner {
    display: none;
    background: var(--accent-cyan-dim);
    border-bottom: 1px solid rgba(0,212,255,0.2);
    padding: 0.5rem 2rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--accent-cyan);
    text-align: center;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }

  .admin-mode .admin-banner { display: flex; }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg-void); }
  ::-webkit-scrollbar-thumb { background: var(--border-glow); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    main { padding: 1rem; }
    .detail-layout { grid-template-columns: 1fr; }
    .detail-thumb, .detail-thumb-placeholder { max-width: 180px; margin: 0 auto; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ADMIN BANNER -->
<div class="admin-banner" id="adminBanner">
  ⬡ ADMIN MODE ACTIVE
  <button class="btn-admin" onclick="exitAdmin()" style="font-size:0.6rem;padding:0.25rem 0.75rem;">LOGOUT</button>
  <button class="btn-admin" onclick="openCatManage()" style="font-size:0.6rem;padding:0.25rem 0.75rem;">MANAGE CATEGORIES</button>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    FEARLESS
    <span>CHARACTER DATABASE</span>
  </div>
  <div class="header-right">
    <div class="status-indicator">
      <div class="status-dot"></div>
      ONLINE
    </div>
    <button class="btn-admin" id="adminToggle" onclick="openAuth()">⬡ ADMIN</button>
  </div>
</header>

<!-- MAIN -->
<main>
  <!-- Search -->
  <div class="search-wrap">
    <div class="search-icon">[ SEARCH ]</div>
    <input type="text" id="searchInput" placeholder="코드네임, 소속, 성별 검색..." oninput="renderCards()">
  </div>

  <!-- Categories -->
  <div class="category-bar" id="categoryBar"></div>

  <!-- Grid -->
  <div class="grid" id="cardGrid"></div>
</main>

<!-- ─── AUTH MODAL ─── -->
<div class="modal-backdrop" id="authModal">
  <div class="modal auth-modal">
    <div class="modal::before"></div>
    <div class="modal-header">
      <div class="modal-title">// ADMIN AUTHENTICATION</div>
      <button class="modal-close" onclick="closeModal('authModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="auth-desc">관리자 비밀번호를 입력하세요.<br>승인된 사용자만 데이터를 수정할 수 있습니다.</div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input type="password" class="form-input" id="pwInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkAuth()">
        <div class="auth-error" id="authError">ACCESS DENIED — 비밀번호가 올바르지 않습니다.</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('authModal')">CANCEL</button>
        <button class="btn btn-primary" onclick="checkAuth()">AUTHENTICATE</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── CHARACTER FORM MODAL ─── -->
<div class="modal-backdrop" id="charModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="charModalTitle">// NEW CHARACTER</div>
      <button class="modal-close" onclick="closeModal('charModal')">✕</button>
    </div>
    <div class="modal-body">
      <!-- Image upload -->
      <div class="form-group">
        <label class="form-label">CHARACTER IMAGE</label>
        <div class="img-upload-area" id="imgUploadArea">
          <input type="file" id="imgFileInput" accept="image/*" onchange="handleImageUpload(event)">
          <img id="imgPreview" class="img-upload-preview" style="display:none;">
          <div id="imgUploadLabel" class="img-upload-label">이미지 클릭하여 업로드<br><span style="color:var(--text-muted);font-size:0.6rem;">권장: 3:4 비율 (증명사진)</span></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">CODENAME *</label>
          <input type="text" class="form-input" id="fCodename" placeholder="코드네임">
        </div>
        <div class="form-group">
          <label class="form-label">GENDER</label>
          <select class="form-select" id="fGender">
            <option value="">선택</option>
            <option value="남성">남성</option>
            <option value="여성">여성</option>
            <option value="불명">불명</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">AFFILIATION</label>
          <input type="text" class="form-input" id="fAffiliation" placeholder="소속">
        </div>
        <div class="form-group">
          <label class="form-label">CATEGORY</label>
          <select class="form-select" id="fCategory"></select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">PROMPT</label>
        <textarea class="form-textarea" id="fPrompt" placeholder="캐릭터 프롬프트를 입력하세요..."></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('charModal')">CANCEL</button>
        <button class="btn btn-primary" id="charSaveBtn" onclick="saveCharacter()">SAVE</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── DETAIL MODAL ─── -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal detail-modal">
    <div class="modal-header">
      <div class="modal-title">// CHARACTER PROFILE</div>
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="detail-layout">
        <div id="detailThumbWrap"></div>
        <div>
          <div class="detail-codename" id="detailCodename"></div>
          <div class="detail-fields" id="detailFields"></div>
          <div class="detail-prompt-label">[ PROMPT ]</div>
          <div class="detail-prompt" id="detailPrompt"></div>
          <button class="copy-btn" onclick="copyPrompt()">⬡ COPY PROMPT</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ─── CATEGORY MANAGE MODAL ─── -->
<div class="modal-backdrop" id="catModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <div class="modal-title">// MANAGE CATEGORIES</div>
      <button class="modal-close" onclick="closeModal('catModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">NEW CATEGORY</label>
        <div style="display:flex;gap:0.5rem;">
          <input type="text" class="form-input" id="newCatInput" placeholder="카테고리명" onkeydown="if(event.key==='Enter')addCategory()">
          <button class="btn btn-primary" onclick="addCategory()" style="white-space:nowrap;">ADD</button>
        </div>
      </div>
      <div id="catList" style="margin-top:0.5rem;"></div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ─── CONFIG ───
// 비밀번호를 아래에서 변경하세요
const ADMIN_PASSWORD_HASH = hashStr('0318'); // ← 여기서 비밀번호 변경

function hashStr(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + c;
    hash |= 0;
  }
  return hash.toString(36);
}

// ─── STATE ───
let isAdmin = false;
let editingId = null;
let activeCategory = 'ALL';
let currentDetailId = null;

let data = {
  categories: ['부서A', '부서B'],
  characters: []
};

// ─── LOAD ───
function load() {
  try {
    const saved = localStorage.getItem('nexus_data');
    if (saved) data = JSON.parse(saved);
  } catch(e) {}
}

function save() {
  localStorage.setItem('nexus_data', JSON.stringify(data));
}

// ─── ADMIN ───
function openAuth() {
  if (isAdmin) { exitAdmin(); return; }
  document.getElementById('pwInput').value = '';
  document.getElementById('authError').style.display = 'none';
  openModal('authModal');
  setTimeout(() => document.getElementById('pwInput').focus(), 100);
}

function checkAuth() {
  const val = document.getElementById('pwInput').value;
  if (hashStr(val) === ADMIN_PASSWORD_HASH) {
    isAdmin = true;
    closeModal('authModal');
    document.body.classList.add('admin-mode');
    document.getElementById('adminToggle').classList.add('active');
    document.getElementById('adminToggle').textContent = '⬡ ADMIN ●';
    renderCards();
    showToast('ADMIN ACCESS GRANTED');
  } else {
    document.getElementById('authError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function exitAdmin() {
  isAdmin = false;
  document.body.classList.remove('admin-mode');
  document.getElementById('adminToggle').classList.remove('active');
  document.getElementById('adminToggle').textContent = '⬡ ADMIN';
  renderCards();
  showToast('ADMIN SESSION ENDED');
}

// ─── CATEGORIES ───
function renderCategoryBar() {
  const bar = document.getElementById('categoryBar');
  bar.innerHTML = '';

  const all = document.createElement('button');
  all.className = 'cat-btn' + (activeCategory === 'ALL' ? ' active' : '');
  all.textContent = 'ALL';
  all.onclick = () => { activeCategory = 'ALL'; renderCategoryBar(); renderCards(); };
  bar.appendChild(all);

  data.categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (activeCategory === cat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeCategory = cat; renderCategoryBar(); renderCards(); };
    bar.appendChild(btn);
  });

  if (isAdmin) {
    const addBtn = document.createElement('button');
    addBtn.className = 'cat-add-btn';
    addBtn.textContent = '+ CATEGORY';
    addBtn.style.display = 'block';
    addBtn.onclick = openCatManage;
    bar.appendChild(addBtn);
  }
}

function openCatManage() {
  renderCatList();
  openModal('catModal');
}

function renderCatList() {
  const list = document.getElementById('catList');
  list.innerHTML = '';
  data.categories.forEach((cat, i) => {
    const item = document.createElement('div');
    item.className = 'cat-list-item';
    item.innerHTML = `
      <span>${cat}</span>
      <div class="cat-list-item-actions">
        <button class="cat-action-btn" onclick="renameCategory(${i})">RENAME</button>
        <button class="cat-action-btn del" onclick="deleteCategory(${i})">DELETE</button>
      </div>`;
    list.appendChild(item);
  });
}

function addCategory() {
  const val = document.getElementById('newCatInput').value.trim();
  if (!val) return;
  if (data.categories.includes(val)) { showToast('이미 존재하는 카테고리입니다'); return; }
  data.categories.push(val);
  save();
  document.getElementById('newCatInput').value = '';
  renderCatList();
  renderCategoryBar();
  showToast('카테고리 추가됨: ' + val);
}

function deleteCategory(i) {
  const cat = data.categories[i];
  if (!confirm(`"${cat}" 카테고리를 삭제할까요?\n해당 카테고리의 캐릭터는 미분류로 변경됩니다.`)) return;
  data.characters.forEach(c => { if (c.category === cat) c.category = ''; });
  data.categories.splice(i, 1);
  save();
  if (activeCategory === cat) activeCategory = 'ALL';
  renderCatList();
  renderCategoryBar();
  renderCards();
  showToast('카테고리 삭제됨');
}

function renameCategory(i) {
  const old = data.categories[i];
  const val = prompt('새 카테고리명:', old);
  if (!val || val === old) return;
  data.characters.forEach(c => { if (c.category === old) c.category = val; });
  data.categories[i] = val;
  save();
  if (activeCategory === old) activeCategory = val;
  renderCatList();
  renderCategoryBar();
  renderCards();
  showToast('카테고리 수정됨');
}

// ─── CARDS ───
function getFilteredChars() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return data.characters.filter(c => {
    const matchCat = activeCategory === 'ALL' || c.category === activeCategory;
    const matchQ = !q || [c.codename, c.affiliation, c.gender].some(v => v && v.toLowerCase().includes(q));
    return matchCat && matchQ;
  });
}

function renderCards() {
  renderCategoryBar();
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';

  const chars = getFilteredChars();

  // Add new card (admin only)
  if (isAdmin) {
    const addCard = document.createElement('div');
    addCard.className = 'card card-add';
    addCard.innerHTML = `<div class="card-add-icon">+</div><div class="card-add-label">NEW CHARACTER</div>`;
    addCard.onclick = () => openCharForm(null);
    grid.appendChild(addCard);
  }

  if (chars.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = isAdmin ? '+ 버튼으로 첫 캐릭터를 추가하세요.' : 'NO DATA FOUND';
    grid.appendChild(empty);
    return;
  }

  chars.forEach(char => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = (e) => {
      if (e.target.closest('.card-admin-controls')) return;
      openDetail(char.id);
    };

    const thumb = char.image
      ? `<img src="${char.image}" alt="${char.codename}">`
      : `<div class="card-thumb-placeholder"><div class="thumb-initials">${(char.codename||'?').slice(0,2).toUpperCase()}</div></div>`;

    const catTag = char.category ? `<div class="card-category-tag">${char.category}</div>` : '';

    card.innerHTML = `
      <div class="card-thumb">
        ${thumb}
        <div class="card-thumb-overlay"></div>
        ${catTag}
        <div class="card-admin-controls">
          <button class="card-edit-btn" onclick="openCharForm('${char.id}')" title="편집">✎</button>
          <button class="card-delete-btn" onclick="deleteChar('${char.id}')" title="삭제">✕</button>
        </div>
      </div>
      <div class="card-info">
        <div class="card-codename">${char.codename || 'UNKNOWN'}</div>
        <div class="card-meta">
          <div class="card-meta-item"><span>소속</span>${char.affiliation || '—'}</div>
          <div class="card-meta-item"><span>성별</span>${char.gender || '—'}</div>
        </div>
      </div>`;

    grid.appendChild(card);
  });
}

// ─── CHAR FORM ───
function openCharForm(id) {
  editingId = id;
  const char = id ? data.characters.find(c => c.id === id) : null;

  document.getElementById('charModalTitle').textContent = char ? '// EDIT CHARACTER' : '// NEW CHARACTER';
  document.getElementById('fCodename').value = char?.codename || '';
  document.getElementById('fGender').value = char?.gender || '';
  document.getElementById('fAffiliation').value = char?.affiliation || '';
  document.getElementById('fPrompt').value = char?.prompt || '';

  // Category select
  const sel = document.getElementById('fCategory');
  sel.innerHTML = '<option value="">미분류</option>';
  data.categories.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    if (char?.category === cat) opt.selected = true;
    sel.appendChild(opt);
  });

  // Image preview
  const preview = document.getElementById('imgPreview');
  const label = document.getElementById('imgUploadLabel');
  if (char?.image) {
    preview.src = char.image;
    preview.style.display = 'block';
    label.style.display = 'none';
  } else {
    preview.style.display = 'none';
    label.style.display = 'block';
  }
  document.getElementById('imgFileInput').value = '';

  openModal('charModal');
}

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const src = ev.target.result;
    document.getElementById('imgPreview').src = src;
    document.getElementById('imgPreview').style.display = 'block';
    document.getElementById('imgUploadLabel').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function saveCharacter() {
  const codename = document.getElementById('fCodename').value.trim();
  if (!codename) { showToast('코드네임을 입력하세요'); return; }

  const imgSrc = document.getElementById('imgPreview').style.display !== 'none'
    ? document.getElementById('imgPreview').src
    : null;

  const charData = {
    codename,
    gender: document.getElementById('fGender').value,
    affiliation: document.getElementById('fAffiliation').value.trim(),
    category: document.getElementById('fCategory').value,
    prompt: document.getElementById('fPrompt').value.trim(),
    image: imgSrc && imgSrc.startsWith('data:') ? imgSrc : (editingId ? data.characters.find(c=>c.id===editingId)?.image : null),
  };

  if (editingId) {
    const idx = data.characters.findIndex(c => c.id === editingId);
    if (idx !== -1) data.characters[idx] = { ...data.characters[idx], ...charData };
    showToast('캐릭터 수정됨');
  } else {
    charData.id = Date.now().toString(36) + Math.random().toString(36).slice(2);
    data.characters.push(charData);
    showToast('캐릭터 추가됨: ' + codename);
  }

  save();
  closeModal('charModal');
  renderCards();
}

function deleteChar(id) {
  const char = data.characters.find(c => c.id === id);
  if (!confirm(`"${char?.codename}" 캐릭터를 삭제할까요?`)) return;
  data.characters = data.characters.filter(c => c.id !== id);
  save();
  renderCards();
  showToast('캐릭터 삭제됨');
}

// ─── DETAIL ───
function openDetail(id) {
  const char = data.characters.find(c => c.id === id);
  if (!char) return;
  currentDetailId = id;

  document.getElementById('detailCodename').textContent = char.codename || 'UNKNOWN';

  const thumbWrap = document.getElementById('detailThumbWrap');
  thumbWrap.innerHTML = char.image
    ? `<img class="detail-thumb" src="${char.image}" alt="${char.codename}">`
    : `<div class="detail-thumb-placeholder">${(char.codename||'?').slice(0,2).toUpperCase()}</div>`;

  const fields = [
    { label: 'CATEGORY', value: char.category || '—' },
    { label: 'AFFILIATION', value: char.affiliation || '—' },
    { label: 'GENDER', value: char.gender || '—' },
  ];
  document.getElementById('detailFields').innerHTML = fields
    .map(f => `<div class="detail-field"><strong>${f.label}</strong>${f.value}</div>`)
    .join('');

  document.getElementById('detailPrompt').textContent = char.prompt || '(프롬프트 없음)';
  openModal('detailModal');
}

function copyPrompt() {
  const char = data.characters.find(c => c.id === currentDetailId);
  if (!char?.prompt) return;
  navigator.clipboard.writeText(char.prompt).then(() => showToast('프롬프트가 복사되었습니다'));
}

// ─── MODAL UTILS ───
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-backdrop').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

// ─── TOAST ───
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── INIT ───
load();
renderCards();
</script>
</body>
</html>
